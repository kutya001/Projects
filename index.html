<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projects · Планирование загрузки разработчиков</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='18' width='60' height='16' rx='4' fill='%230B7285'/><rect x='30' y='42' width='62' height='16' rx='4' fill='%23E8A13C'/><rect x='16' y='66' width='44' height='16' rx='4' fill='%23D1495B'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141B26; --ink2:#1E2836; --paper:#F1F2EC; --card:#FFFFFF;
  --line:#D9DCD2; --line2:#E7E9E0; --mut:#68727F; --mut2:#96A0AC;
  --acc:#0B7285; --acc2:#0A5C6C; --amb:#E8A13C; --red:#D1495B; --grn:#2F9E63;
  --side:#10151F; --side2:#161E2B;
  --gridc:rgba(20,27,38,.08); --gridc2:rgba(20,27,38,.18);
  --sh:0 1px 2px rgba(16,21,31,.06),0 4px 14px rgba(16,21,31,.06);
  --sh2:0 6px 24px rgba(16,21,31,.16);
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Golos Text',system-ui,sans-serif;font-size:14px;color:var(--ink);background:var(--paper);overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(20,27,38,.10) 1px,transparent 1.2px);background-size:22px 22px;
  mask-image:linear-gradient(180deg,transparent 0,#000 120px)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#C4C9BD;border-radius:6px;border:2px solid var(--paper)}::-webkit-scrollbar-track{background:transparent}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=date],input[type=number],input[type=url],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;outline:none;transition:border .15s, box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(11,114,133,.14)}
textarea{resize:vertical;min-height:64px}
label.fl{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 5px}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
.hidden{display:none!important}

#app{display:grid;grid-template-columns:236px 1fr;height:100vh;position:relative;z-index:1}
#side{background:linear-gradient(180deg,var(--side) 0%,#0B1017 100%);color:#C8D0DC;display:flex;flex-direction:column;overflow:hidden}
#side::before{content:"";position:absolute;inset:0 0 auto 0;height:220px;background:radial-gradient(420px 200px at 20% -40px,rgba(11,114,133,.35),transparent 70%);pointer-events:none}
.logo{padding:22px 20px 16px;position:relative}
.logo .mk{font-family:'Unbounded';font-weight:900;font-size:19px;color:#fff;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.logo .mk i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--acc),#12A5C4);display:grid;place-items:center;font-style:normal;color:#fff;font-size:13px;box-shadow:0 4px 12px rgba(11,114,133,.5)}
.logo .sub{margin-top:6px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#5E6B7E;font-weight:600}
nav{padding:8px 10px;display:flex;flex-direction:column;gap:2px;position:relative}
nav .nv{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;cursor:pointer;color:#9AA6B8;font-weight:600;position:relative;transition:.16s;border:1px solid transparent;user-select:none}
nav .nv:hover{color:#fff;background:rgba(255,255,255,.05);transform:translateX(2px)}
nav .nv.on{color:#fff;background:var(--side2);border-color:rgba(255,255,255,.07)}
nav .nv.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 10px rgba(11,114,133,.9)}
nav .nv svg{width:17px;height:17px;flex:none}
nav .nv .cnt{margin-left:auto;font-family:'JetBrains Mono';font-size:10.5px;background:rgba(255,255,255,.08);padding:2px 7px;border-radius:20px;color:#AEB9CA}
nav .nv.on .cnt{background:var(--acc);color:#fff}
.side-foot{margin-top:auto;padding:16px 20px;border-top:1px solid rgba(255,255,255,.06);font-size:11px;color:#525F73;line-height:1.7}
.side-foot b{color:#8B98AB}
#main{display:grid;grid-template-rows:auto 1fr auto;min-width:0}

#topbar{display:flex;align-items:center;gap:14px;padding:10px 20px;background:#FBFBF8;border-bottom:1px solid var(--line);z-index:5}
.search{position:relative;width:min(430px,38vw)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mut2);pointer-events:none;transition:.2s}
.search input{padding-left:34px;border-radius:22px;background:#fff}
.search input:focus + svg, .search:focus-within svg{color:var(--acc)}
.beacon{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--mut);padding:5px 10px;border:1px solid var(--line);border-radius:20px;background:#fff;white-space:nowrap}
.beacon .dot{width:9px;height:9px;border-radius:50%;background:#A5AEBB;flex:none}
.beacon.ok{color:#196B45}.beacon.ok .dot{background:var(--grn);animation:pulse 2.2s infinite}
.beacon.warn{color:#8A6110}.beacon.warn .dot{background:var(--amb)}
.beacon.err{color:#9E2A38}.beacon.err .dot{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,158,99,.45)}70%{box-shadow:0 0 0 7px rgba(47,158,99,0)}100%{box-shadow:0 0 0 0 rgba(47,158,99,0)}}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap;user-select:none}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh);border-color:#C6CBBD}
.btn:active{transform:translateY(0)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dgr{color:#A32638;border-color:#E7C3C8}.btn.dgr:hover{background:#FBEDEE}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:6px}
.ibtn{width:28px;height:28px;display:inline-grid;place-items:center;border-radius:6px;border:none;background:transparent;cursor:pointer;color:var(--mut);transition:.14s}
.ibtn:hover{background:var(--line2);color:var(--ink);transform:translateY(-1px)}
.ibtn svg{width:15px;height:15px}
.seg{display:inline-flex;background:#E6E8DF;border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--mut);cursor:pointer;transition:.16s;display:flex;gap:7px;align-items:center}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.seg button .n{font-family:'JetBrains Mono';font-size:10px;background:var(--line2);padding:1px 6px;border-radius:10px}
.seg button.on .n{background:var(--acc);color:#fff}

#page{overflow:auto;padding:22px 24px 30px;min-width:0}
.phead{display:flex;align-items:flex-end;gap:18px;margin-bottom:18px;flex-wrap:wrap;animation:rise .35s ease both}
.phead .kick{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:4px}
.phead h1{font-family:'Unbounded';font-weight:700;font-size:26px;letter-spacing:-.01em;line-height:1.1}
.phead .big-n{font-family:'Unbounded';font-weight:900;font-size:40px;color:transparent;-webkit-text-stroke:1.4px var(--ink);opacity:.25;line-height:1;margin-left:2px}
.phead .sp{flex:1}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line2)}
.toolbar .sp{flex:1}

.tbl-wrap{overflow:auto;max-height:calc(100vh - 262px);border-radius:0 0 10px 10px}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;min-width:600px}
.tbl thead th{position:sticky;top:0;background:#F6F7F2;z-index:3;text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl thead th .thc{display:flex;align-items:center;gap:5px;padding:9px 10px;cursor:pointer;user-select:none}
.tbl thead th .thc:hover{color:var(--ink)}
.tbl thead th .thc .lbl:hover{text-decoration:underline;text-underline-offset:3px}
.tbl .sarr{font-size:9px;color:var(--acc)}
.tbl .fbtn{border:none;background:transparent;cursor:pointer;color:#B7BEAF;display:inline-grid;place-items:center;padding:2px;border-radius:4px;transition:.13s}
.tbl .fbtn:hover{color:var(--ink);background:var(--line2)}
.tbl .fbtn.on{color:var(--acc)}
.tbl .fbtn svg{width:11px;height:11px}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle;font-size:13px}
.tbl tbody tr.rw{cursor:pointer;transition:background .12s}
.tbl tbody tr.rw:hover{background:#F4F6EF}
.tbl tbody tr.rw:nth-child(4n+3){background:rgba(217,220,210,.18)}
.tbl tbody tr.rw:nth-child(4n+3):hover{background:#F4F6EF}
.exp{width:20px;height:20px;border-radius:5px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:9px;color:var(--mut);transition:.15s;display:inline-grid;place-items:center}
.exp:hover{border-color:var(--acc);color:var(--acc)}
.exp.open{background:var(--acc);color:#fff;border-color:var(--acc);transform:rotate(90deg)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2.5px 9px;border-radius:20px;font-size:11.5px;font-weight:600;border:1px solid;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;flex:none}
.numcell{font-family:'JetBrains Mono';font-size:11.5px;font-weight:600;color:var(--mut)}
.namecell{font-weight:600;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subrow td{background:#F8F9F4;padding:0}
.subpad{padding:8px 14px 14px 46px}
.subpad .stt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:7px}
.mini-t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mini-t td{padding:6px 10px;border-bottom:1px solid var(--line2);font-size:12.5px}
.mini-t tr:last-child td{border-bottom:none}
.mini-t tr{cursor:pointer}.mini-t tr:hover td{background:#F1F5EF}
.progwrap{display:flex;align-items:center;gap:7px}
.progbar{width:76px;height:7px;border-radius:5px;background:var(--line2);overflow:hidden;flex:none}
.progbar i{display:block;height:100%;border-radius:5px;background:var(--acc);transition:width .4s}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

.kb{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;padding:4px 2px 16px;height:calc(100vh - 268px);align-items:stretch}
.kb-col{flex:0 0 292px;display:flex;flex-direction:column;background:#EAECE3;border:1px solid var(--line);border-radius:10px;max-height:100%;transition:.15s}
.kb-col.over{outline:2px dashed var(--acc);outline-offset:-4px;background:#E8F1F0}
.kb-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;border-top:3px solid var(--kc,#999);border-radius:10px 10px 0 0;background:#F3F4ED}
.kb-h b{font-size:13px}
.kb-h .n{margin-left:auto;font-family:'JetBrains Mono';font-size:10.5px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:12px;padding:1px 8px}
.kb-body{padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1}
.kcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 11px;cursor:grab;box-shadow:0 1px 1px rgba(16,21,31,.04);transition:transform .14s, box-shadow .14s;position:relative;animation:rise .3s ease both}
.kcard:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.kcard.drag{opacity:.5;transform:rotate(2deg)}
.kcard .kn{font-family:'JetBrains Mono';font-size:10px;color:var(--mut2);font-weight:600}
.kcard .kt{font-weight:600;font-size:13px;margin:2px 0 6px;line-height:1.3}
.kcard .krow{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:5px}
.kcard .kdate{font-family:'JetBrains Mono';font-size:10.5px;color:var(--mut)}
.kcard .kprj{font-size:11px;color:var(--mut);border-top:1px dashed var(--line2);margin-top:7px;padding-top:6px}
.kcard .own{position:absolute;top:0;bottom:0;left:0;width:3.5px;border-radius:8px 0 0 8px}

.tl-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tl-tools .hint{font-size:11.5px;color:var(--mut);margin-left:auto}
.tl-scroll{overflow:auto;max-height:calc(100vh - 292px);background:#fff;border:1px solid var(--line);border-radius:10px;position:relative;box-shadow:var(--sh)}
.tl-corner{position:sticky;left:0;top:0;z-index:9;background:#F6F7F2;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;padding:8px 12px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700}
.tl-headrow{display:flex;position:sticky;top:0;z-index:8}
.tl-hc{position:relative;background:#F6F7F2;border-bottom:1px solid var(--line)}
.tl-hseg{display:flex;height:24px}
.tl-hseg div{display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:700;color:var(--mut);border-right:1px solid var(--line);overflow:hidden;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.tl-hseg.bot div{font-weight:600;font-size:11px;color:var(--ink);cursor:pointer;text-transform:none;letter-spacing:0}
.tl-hseg.bot div:hover{background:#EDF2EA}
.tl-hseg.bot div.we{color:var(--red)}
.tl-hseg.bot div.tod{background:rgba(232,161,60,.22);color:#7A5110}
.tl-row{display:flex;border-bottom:1px solid var(--line2)}
.tl-left{position:sticky;left:0;z-index:6;background:#FBFBF7;border-right:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:9px;min-width:220px;max-width:220px}
.tl-left .nm{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-left .ct{font-family:'JetBrains Mono';font-size:10px;color:var(--mut2)}
.tl-left .more{margin-left:auto;font-family:'JetBrains Mono';font-size:10.5px;font-weight:700;background:var(--ink);color:#fff;border-radius:12px;padding:2px 8px;cursor:pointer;transition:.14s;flex:none}
.tl-left .more:hover{background:var(--acc);transform:scale(1.08)}
.tl-canvas{position:relative;flex:none}
.bar{position:absolute;height:22px;border-radius:5px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:600;color:#fff;overflow:hidden;white-space:nowrap;cursor:grab;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 3px rgba(16,21,31,.22);transition:transform .12s,box-shadow .12s;user-select:none;touch-action:none}
.bar:hover{transform:translateY(-1.5px);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 5px 14px rgba(16,21,31,.3);z-index:4}
.bar.dragging{transition:none;opacity:.88;z-index:7;cursor:grabbing;box-shadow:0 10px 24px rgba(16,21,31,.35)}
.bar .bn{opacity:.75;font-family:'JetBrains Mono';font-size:9.5px;margin-right:6px;font-weight:600}
.bar .hnd{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize}
.bar .hnd.l{left:0}.bar .hnd.r{right:0}
.bar .hnd::after{content:"";position:absolute;top:6px;bottom:6px;width:2px;border-radius:2px;background:rgba(255,255,255,.55);opacity:0;transition:.15s}
.bar .hnd.l::after{left:2.5px}.bar .hnd.r::after{right:2.5px}
.bar:hover .hnd::after{opacity:1}
.tl-today{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--amb);z-index:3;pointer-events:none}
.tl-today::before{content:"сегодня";position:sticky;top:52px;display:block;color:#7A5110;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transform:translateX(4px)}
.tip{position:fixed;z-index:200;background:var(--ink);color:#fff;font-size:11.5px;padding:6px 10px;border-radius:6px;pointer-events:none;box-shadow:var(--sh2);font-family:'JetBrains Mono';white-space:nowrap}
.emptyrow{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mut2);font-size:11.5px}

#statusbar{display:flex;gap:20px;align-items:center;padding:6px 20px;background:#FBFBF8;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut)}
#statusbar b{color:var(--ink);font-weight:700}
#statusbar .sp{flex:1}

.ovl{position:fixed;inset:0;background:rgba(16,21,31,.46);backdrop-filter:blur(2px);z-index:50;display:grid;place-items:center;padding:20px;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.mdl{background:#fff;border-radius:12px;box-shadow:var(--sh2);width:min(760px,96vw);max-height:92vh;display:flex;flex-direction:column;animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.mdl.wide{width:min(980px,96vw)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}}
.mdl-h{padding:18px 22px 14px;border-bottom:1px solid var(--line2);display:flex;gap:12px;align-items:flex-start}
.mdl-h h2{font-family:'Unbounded';font-size:17px;font-weight:700;line-height:1.25}
.mdl-h .x{margin-left:auto}
.mdl-b{padding:18px 22px;overflow:auto}
.mdl-f{padding:14px 22px;border-top:1px solid var(--line2);display:flex;gap:10px;justify-content:flex-end;background:#FAFAF6;border-radius:0 0 12px 12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fgrid .full{grid-column:1/-1}
.ftabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);padding:0 22px}
.ftabs button{border:none;background:none;padding:10px 14px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13px}
.ftabs button.on{color:var(--acc);border-color:var(--acc)}
.dl{display:grid;grid-template-columns:170px 1fr;gap:8px 14px;font-size:13px}
.dl dt{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding-top:1px}
.dl dd{line-height:1.45}
.qbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 22px;background:#F7F8F3;border-bottom:1px solid var(--line2)}
.qbar .qsel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-weight:600}
.qbar select{width:auto;padding:5px 8px;font-size:12px}
.mcheck{display:flex;flex-wrap:wrap;gap:6px;max-height:120px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:7px;background:#FBFBF8}
.mcheck label{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:14px;background:#fff;border:1px solid var(--line);cursor:pointer;transition:.13s}
.mcheck label:hover{border-color:var(--acc)}
.mcheck input{accent-color:var(--acc)}
.stageed{display:flex;flex-direction:column;gap:9px;border:1px solid var(--line);border-radius:8px;padding:12px;background:#FBFBF8}
.stageed .sr{display:grid;grid-template-columns:90px 1fr 52px;gap:12px;align-items:center;font-size:12.5px;font-weight:600}
.stageed input[type=range]{accent-color:var(--acc);width:100%}
.stageed .pv{font-family:'JetBrains Mono';text-align:right}
.hist td{font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line2)}
.delta-up{color:var(--grn);font-weight:700}.delta-dn{color:var(--red);font-weight:700}
.pop{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:var(--sh2);padding:10px;min-width:220px;animation:pop .16s ease}
.pop .pt{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:8px}
.pop .pi{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:600}
.pop .pi:hover{background:#F1F4EE}
.pop .pi input{accent-color:var(--acc)}

</div>
<div id="modalRoot"></div>
<div id="popRoot"></div>

<script src="https://unpkg.com/dexie@4.0.8/dist/dexie.min.js"></script>
<script>
"use strict";
if (typeof Dexie === 'undefined'){
  document.body.innerHTML = '<div style="padding:60px;font-family:sans-serif"><h2>Не удалось загрузить Dexie.js</h2><p>Для первого запуска нужен интернет (CDN), либо положите файл <b>dexie.min.js</b> рядом и замените src скрипта.</p></div>';
  throw new Error('Dexie missing');
}

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const nowIso=()=>new Date().toISOString();
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const toISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return toISO(d)};
const diffDays=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5)+1;
const fmtD=iso=>iso?new Date(iso.length>10?iso:iso+'T00:00:00').toLocaleDateString('ru-RU'):'—';
const fmtDT=iso=>iso?new Date(iso).toLocaleString('ru-RU'):'—';
const stamp=()=>{const d=new Date();return ''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())};
function lum(hex){try{const h=(hex||'').replace('#','');const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return .299*r+.587*g+.114*b}catch(e){return 200}}
const txtOn=hex=>lum(hex)>150?'#1B2430':'#FFFFFF';
function tint(hex,a){try{const h=(hex||'#888').replace('#','');const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return `rgba(${r},${g},${b},${a})`}catch(e){return `rgba(120,120,120,${a})`}}
function download(name,text){const b=new Blob([text],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
const MONTHS=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];

/* ---------- DB ---------- */
const db=new Dexie('AppDatabase');
/* ИСПРАВЛЕНО: версия увеличена до 2, чтобы избежать SchemaDiff warning */
db.version(2).stores({
  projects:"++id,num,name,statusId,priorityId,stageId,start,end,createdAt,updatedAt",
  tasks:"++id,num,name,projectId,statusId,priorityId,agentId,devId,start,end,createdAt,updatedAt",
  changes:"++id,num,name,taskId,statusId,priorityId,agentId,devId,start,end,createdAt,updatedAt",
  employees:"++id,name,role",
  priorities:"++id,name,weight",
  taskStatuses:"++id,name,order",
  projectStatuses:"++id,name",
  stages:"++id,name,order",
  stageHistory:"++id,projectId,ts",
  meta:"key"
});

const S={projects:[],tasks:[],changes:[],employees:[],priorities:[],taskStatuses:[],projectStatuses:[],stages:[],history:[],
  prefs:{tables:{},cards:{},views:{},kanbanGroup:{},tlGroup:{},tlMode:{},tlColor:{}},
  counters:{p:0,t:0,c:0}, lastSaved:null, lastExport:null, fileHandle:null, search:'', page:'projects'};
const EXP={projects:new Set(),tasks:new Set()};
const ENT={
  projects:{ru:'Проекты',one:'проект',acc:'Проекты',letter:'P',ctr:'p'},
  tasks:{ru:'Задачи',one:'задача',acc:'Задачи',letter:'T',ctr:'t'},
  changes:{ru:'Изменения',one:'изменение',acc:'Изменения',letter:'C',ctr:'c'}
};
const REFTABS=[['employees','Сотрудники'],['priorities','Приоритеты'],['taskStatuses','Статусы задач/изменений'],['projectStatuses','Статусы проектов'],['stages','Этапы проектов']];
const REFNAME={employees:'Сотрудник',priorities:'Приоритет',taskStatuses:'Статус',projectStatuses:'Статус проекта',stages:'Этап'};

const emp=id=>S.employees.find(e=>e.id===id);
const pri=id=>S.priorities.find(p=>p.id===id);
const stg=id=>S.stages.find(s=>s.id===id);
const statFor=(ent,id)=>(ent==='projects'?S.projectStatuses:S.taskStatuses).find(s=>s.id===id);
const prj=id=>S.projects.find(p=>p.id===id);
const tsk=id=>S.tasks.find(t=>t.id===id);
const colorOf=x=>(x&&x.color)||'#8A94A6';

function setDbBeacon(state,text){
  const el=$('#dbBeacon');el.className='beacon '+(state==='saved'?'ok':state==='error'?'err':state==='dirty'?'warn':'');
  el.querySelector('.txt').textContent=text;
}
function updateBackupBeacon(){
  const el=$('#bkBeacon');
  if(!S.lastExport){el.className='beacon err';el.querySelector('.txt').textContent='🔴 Резервная копия отсутствует';}
  else if(S.lastSaved && S.lastSaved>S.lastExport){el.className='beacon warn';el.querySelector('.txt').textContent='🟡 После последнего экспорта есть изменения';}
  else{el.className='beacon ok';el.querySelector('.txt').textContent='🟢 Резервная копия актуальна';}
  $('#sbExport').textContent=S.lastExport?fmtDT(S.lastExport):'—';
}
async function afterChange(){
  S.lastSaved=nowIso();
  try{await db.meta.put({key:'lastSaved',value:S.lastSaved})}catch(e){}
  setDbBeacon('saved','🟢 База данных сохранена');
  $('#sbSaved').textContent=fmtDT(S.lastSaved);
  updateBackupBeacon();updateCounts();scheduleAutoFile();
}
function updateCounts(){
  $('#cnt-p').textContent=S.projects.length;$('#cnt-t').textContent=S.tasks.length;$('#cnt-c').textContent=S.changes.length;
  $('#sbCount').textContent=S.projects.length+S.tasks.length+S.changes.length;
  $('#sbSplit').textContent=`· П:${S.projects.length} З:${S.tasks.length} И:${S.changes.length}`;
}
function toast(msg,kind){const t=document.createElement('div');t.className='toast '+(kind||'');t.innerHTML=esc(msg);$('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.4s';setTimeout(()=>t.remove(),400)},3200)}
function confirmBox(msg,onYes){
  modal({title:'Подтверждение',body:`<p style="font-size:14px;line-height:1.55">${esc(msg)}</p>`,
    foot:`<button class="btn" data-x>Отмена</button><button class="btn dgr" data-ok>Удалить</button>`,
    /* ИСПРАВЛЕНО: box.el.querySelector вместо box.querySelector */
    mount(box){
      box.el.querySelector('[data-x]').onclick=()=>box.close();
      box.el.querySelector('[data-ok]').onclick=()=>{box.close();onYes()};
    }});
}

function modal({title,sub,body,foot,wide,mount}){
  const root=$('#modalRoot');const ovl=document.createElement('div');ovl.className='ovl';
  ovl.innerHTML=`<div class="mdl ${wide?'wide':''}">
    <div class="mdl-h"><div><div class="mono" style="color:var(--acc);font-size:10px;letter-spacing:.2em;margin-bottom:3px">${esc(sub||'')}</div><h2>${title}</h2></div>
    <button class="ibtn x" title="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
    <div class="mdl-b">${body}</div>${foot?`<div class="mdl-f">${foot}</div>`:''}</div>`;
  root.appendChild(ovl);
  const close=()=>ovl.remove();
  ovl.querySelector('.x').onclick=close;
  ovl.addEventListener('mousedown',e=>{if(e.target===ovl)close()});
  const onKey=e=>{if(e.key==='Escape'){close();document.removeEventListener('keydown',onKey)}};
  document.addEventListener('keydown',onKey);
  /* mount получает объект {el, close} */
  if(mount)mount({el:ovl,close});
  return {close,el:ovl};
}
let curPop=null;
function popover(anchor,html,onMount){
  closePop();
  const p=document.createElement('div');p.className='pop';p.innerHTML=html;document.body.appendChild(p);
  const r=anchor.getBoundingClientRect();
  let x=Math.min(r.left,innerWidth-p.offsetWidth-14),y=r.bottom+6;
  if(y+p.offsetHeight>innerHeight-10)y=r.top-p.offsetHeight-6;
  p.style.left=Math.max(8,x)+'px';p.style.top=Math.max(8,y)+'px';
  curPop=p;
  setTimeout(()=>document.addEventListener('mousedown',popAway),0);
  if(onMount)onMount(p);
}
function popAway(e){if(curPop&&!curPop.contains(e.target))closePop()}
function closePop(){if(curPop){curPop.remove();curPop=null}document.removeEventListener('mousedown',popAway)}

async function savePrefs(){try{await db.meta.put({key:'prefs',value:S.prefs});await db.meta.put({key:'counters',value:S.counters})}catch(e){setDbBeacon('error','🔴 Ошибка базы данных')}}
function tblState(tid,allKeys){
  S.prefs.tables[tid]=S.prefs.tables[tid]||{};const st=S.prefs.tables[tid];
  let order=(st.order||[]).filter(k=>allKeys.includes(k));
  allKeys.forEach(k=>{if(!order.includes(k))order.push(k)});
  st.order=order;st.hidden=(st.hidden||[]).filter(k=>allKeys.includes(k));st.filters=st.filters||{};
  return st;
}
function cardFields(ent){
  const all=['num','name','dates','status','priority','owner','project','stage'];
  if(!S.prefs.cards[ent])S.prefs.cards[ent]=ent==='projects'?['num','name','dates','status','priority','stage']:['num','name','dates','status','priority','owner','project'];
  return {list:S.prefs.cards[ent],all};
}

function col(k,label,type,o={}){return {k,label,type,...o}}
const COLDEFS={
 projects:[
  col('num','№','text',{w:74}), col('name','Название','text'),
  col('statusId','Статус','select',{dir:()=>S.projectStatuses}),
  col('priorityId','Приоритет','select',{dir:()=>S.priorities}),
  col('stageId','Этап','select',{dir:()=>S.stages}),
  col('progress','Этапы %','custom'),
  col('start','Начало','date'), col('end','Конец','date'),
  col('tasksCount','Задач','number'),
  col('agents','Агенты','multi',{role:'agent'}), col('devs','Разработчики','multi',{role:'dev'}),
  col('desc','Описание','text'), col('note','Примечание','text'),
  col('createdAt','Создан','date'), col('updatedAt','Изменен','date')
 ],
 tasks:[
  col('num','№','text',{w:74}), col('name','Название','text'),
  col('projectId','Проект','select',{dir:()=>S.projects}),
  col('statusId','Статус','select',{dir:()=>S.taskStatuses}),
  col('priorityId','Приоритет','select',{dir:()=>S.priorities}),
  col('devId','Разработчик (гл.)','select',{dir:()=>S.employees.filter(e=>e.role==='dev')}),
  col('agentId','Агент (гл.)','select',{dir:()=>S.employees.filter(e=>e.role==='agent')}),
  col('extNum','№ в системе','text'), col('extLink','Ссылка','link'),
  col('start','Начало','date'), col('end','Конец','date'),
  col('changesCount','Изменений','number'),
  col('agents','Агенты (участ.)','multi',{role:'agent'}), col('devs','Разработчики (участ.)','multi',{role:'dev'}),
  col('desc','Описание','text'), col('note','Примечание','text'),
  col('createdAt','Создана','date'), col('updatedAt','Изменена','date')
 ],
 changes:[
  col('num','№','text',{w:74}), col('name','Название','text'),
  col('taskId','Задача','select',{dir:()=>S.tasks}),
  col('statusId','Статус','select',{dir:()=>S.taskStatuses}),
  col('priorityId','Приоритет','select',{dir:()=>S.priorities}),
  col('devId','Разработчик (гл.)','select',{dir:()=>S.employees.filter(e=>e.role==='dev')}),
  col('agentId','Агент (гл.)','select',{dir:()=>S.employees.filter(e=>e.role==='agent')}),
  col('extNum','№ в системе','text'), col('extLink','Ссылка','link'),
  col('start','Начало','date'), col('end','Конец','date'),
  col('desc','Описание','text'), col('note','Примечание','text'),
  col('createdAt','Создано','date'), col('updatedAt','Изменено','date')
 ]
};
const DEFAULT_HIDDEN={projects:['desc','note','agents','devs','createdAt'],
 tasks:['desc','note','agents','devs','changesCount','createdAt','extLink'],
 changes:['desc','note','extLink','createdAt']};
function colVal(ent,r,k){
  switch(k){
    case 'tasksCount':return S.tasks.filter(t=>t.projectId===r.id).length;
    case 'changesCount':return S.changes.filter(c=>c.taskId===r.id).length;
    case 'progress':{const v=Object.values(r.stageProgress||{});return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0}
    case 'agents':return (r.agents||[]).map(id=>(emp(id)||{}).name||'').filter(Boolean).join(', ');
    case 'devs':return (r.devs||[]).map(id=>(emp(id)||{}).name||'').filter(Boolean).join(', ');
    case 'projectId':return prj(r.projectId)?.name||null;
    case 'taskId':return tsk(r.taskId)?.name||null;
    default:return r[k];
  }
}
function dirItem(colDef,id){return (colDef.dir?colDef.dir():[]).find(x=>x.id===id)}
function chipHtml(name,color){return `<span class="chip" style="background:${tint(color,.13)};border-color:${tint(color,.45)};color:${txtOn('#f8f8f8')==='#1B2430'?shade(color):'#333'}"><i style="background:${color}"></i>${esc(name)}</span>`}
function shade(hex){try{const h=hex.replace('#','');const f=parseInt(h.substr(0,2),16),s=parseInt(h.substr(2,2),16),t=parseInt(h.substr(4,2),16);const d=v=>Math.max(0,Math.round(v*.55));return `rgb(${d(f)},${d(s)},${d(t)})`}catch(e){return '#333'}}
function cellHtml(ent,cdef,r){
  const k=cdef.k;
  if(cdef.type==='select'){const it=dirItem(cdef,r[k]);return it?chipHtml(it.name,colorOf(it)):`<span style="color:var(--mut2)">—</span>`}
  if(cdef.type==='multi'){const ids=r[k==='agents'?'agents':'devs']||[];if(!ids.length)return `<span style="color:var(--mut2)">—</span>`;
    return ids.slice(0,3).map(id=>{const e=emp(id);return e?`<span class="chip" style="margin:1px 2px 1px 0;background:${tint(colorOf(e),.13)};border-color:${tint(colorOf(e),.4)}"><i style="background:${colorOf(e)}"></i>${esc(e.name)}</span>`:''}).join('')+(ids.length>3?`<span class="mono" style="color:var(--mut)">+${ids.length-3}</span>`:'')}
  if(cdef.type==='date'){return r[k]?`<span class="mono">${fmtD(r[k])}</span>`:`<span style="color:var(--mut2)">—</span>`}
  if(cdef.type==='number')return `<span class="mono">${colVal(ent,r,k)}</span>`;
  if(k==='progress'){const v=colVal(ent,r,k);return `<div class="progwrap"><div class="progbar"><i style="width:${v}%"></i></div><span class="mono">${v}%</span></div>`}
  if(k==='extLink')return r.extLink?`<a href="${esc(r.extLink)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--acc)">🔗 открыть</a>`:`<span style="color:var(--mut2)">—</span>`;
  if(k==='name')return `<span class="namecell" title="${esc(r.name)}">${esc(r.name)}</span>`;
  if(k==='num')return `<span class="numcell">${esc(r.num)}</span>`;
  const v=colVal(ent,r,k);return v?`<span style="color:${(k==='desc'||k==='note')?'var(--mut)':'inherit'};max-width:260px;display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom" title="${esc(v)}">${esc(v)}</span>`:`<span style="color:var(--mut2)">—</span>`;
}

const ROWCAP=800;
function matchSearch(ent,r){
  if(!S.search)return true;
  const q=S.search.toLowerCase();
  return COLDEFS[ent].some(c=>String(colVal(ent,r,c.k)??'').toLowerCase().includes(q));
}
function applyFilters(ent,rows,st){
  return rows.filter(r=>{
    for(const k in st.filters){
      const f=st.filters[k];const cdef=COLDEFS[ent].find(c=>c.k===k);if(!cdef||!f)continue;
      if(f.type==='sel'){const raw=r[k];if(Array.isArray(raw)){if(!raw.some(v=>f.sel.includes(v)))return false}else if(!f.sel.includes(raw??null))return false}
      else if(f.type==='date'){const v=r[k];if(!v)return false;if(f.from&&v<f.from)return false;if(f.to&&v>f.to)return false}
      else if(f.type==='txt'){if(!String(colVal(ent,r,k)??'').toLowerCase().includes(f.q.toLowerCase()))return false}
    }
    return true;
  });
}
function sortRows(ent,rows,st){
  if(!st.sort||!st.sort.k)return rows;
  const cdef=COLDEFS[ent].find(c=>c.k===st.sort.k);const dir=st.sort.d||1;
  return [...rows].sort((a,b)=>{
    let va,vb;
    if(cdef&&cdef.type==='select'){va=(dirItem(cdef,a[st.sort.k])||{}).name||'';vb=(dirItem(cdef,b[st.sort.k])||{}).name||''}
    else{va=colVal(ent,a,st.sort.k);vb=colVal(ent,b,st.sort.k)}
    if(va==null||va==='')return 1;if(vb==null||vb==='')return -1;
    if(cdef&&(cdef.type==='date'||cdef.type==='number'))return (va>vb?1:va<vb?-1:0)*dir;
    return String(va).localeCompare(String(vb),'ru')*dir;
  });
}

const PPD={day:44,month:13,quarter:4.5,year:1.2};
const MAXLANE={day:7,month:4,quarter:3,year:2};
const MODES=[['year','Годы'],['quarter','Кварталы'],['month','Месяцы'],['day','Дни']];
function tlWindow(mode,anchor){
  const a=new Date(anchor+'T00:00:00');let ws,we;
  if(mode==='day'){ws=new Date(a.getFullYear(),a.getMonth(),1);we=new Date(a.getFullYear(),a.getMonth()+1,0)}
  else if(mode==='month'){ws=new Date(a.getFullYear(),a.getMonth(),1);we=new Date(a.getFullYear(),a.getMonth()+3,0)}
  else if(mode==='quarter'){const q=Math.floor(a.getMonth()/3);ws=new Date(a.getFullYear(),q*3,1);we=new Date(a.getFullYear(),q*3+12,0)}
  else{ws=new Date(a.getFullYear()-1,0,1);we=new Date(a.getFullYear()+3,11,31)}
  return {ws,we,days:Math.round((we-ws)/864e5)+1};
}
function tlGroupDefs(ent,by){

  if(by==='dev')return (r.devId??null)===(g.id??null);

const TL_ANCHOR={};
function renderTimelineView(ent,mount){
  const mode=S.prefs.tlMode[ent]||'month';
  const groupBy=S.prefs.tlGroup[ent]||(ent==='projects'?'status':(ent==='tasks'?'dev':'dev'));
  const colorBy=S.prefs.tlColor[ent]||'status';
  const today=todayISO();
  if(!TL_ANCHOR[ent])TL_ANCHOR[ent]=today;
  const {ws,we,days}=tlWindow(mode,TL_ANCHOR[ent]);
  const ppd=PPD[mode];const totalW=Math.round(days*ppd);const LEFTW=220;
  let topSegs=[],botSegs=[];
  const pushSeg=(arr,label,d,cls)=>arr.push({label,d,cls});
  const d0=new Date(ws);
  if(mode==='day'){
    let cur=null,cnt=0;
    for(let i=0;i<days;i++){const dd=new Date(d0);dd.setDate(dd.getDate()+i);
      const mk=dd.getFullYear()+'-'+MONTHS[dd.getMonth()];
      if(cur!==mk){if(cur)pushSeg(topSegs,cur,cnt);cur=mk;cnt=1}else cnt++;
      const wd=dd.getDay();const cls=(wd===0||wd===6?'we ':'')+(toISO(dd)===today?'tod':'');
      pushSeg(botSegs,dd.getDate(),1,cls)}
    pushSeg(topSegs,cur,cnt);
  }else if(mode==='month'){
    let cy=null,cnt=0;
    for(let i=0;i<days;i++){const dd=new Date(d0);dd.setDate(dd.getDate()+i);
      if(cy!==dd.getFullYear()){if(cy!==null)pushSeg(topSegs,cy,cnt);cy=dd.getFullYear();cnt=1}else cnt++;}
    pushSeg(topSegs,cy,cnt);
    let cm=null,cc=0;
    for(let i=0;i<days;i++){const dd=new Date(d0);dd.setDate(dd.getDate()+i);
      const mk=MONTHS[dd.getMonth()]+' ’'+String(dd.getFullYear()).slice(2);
      if(cm!==mk){if(cm)pushSeg(botSegs,cm,cc);cm=mk;cc=1}else cc++}
    pushSeg(botSegs,cm,cc);
  }else if(mode==='quarter'){
    let cy=null,cnt=0;
    for(let i=0;i<days;i++){const dd=new Date(d0);dd.setDate(dd.getDate()+i);
      if(cy!==dd.getFullYear()){if(cy!==null)pushSeg(topSegs,cy,cnt);cy=dd.getFullYear();cnt=1}else cnt++}
    pushSeg(topSegs,cy,cnt);
    let cq=null,cc=0;
    for(let i=0;i<days;i++){const dd=new Date(d0);dd.setDate(dd.getDate()+i);
      const q=Math.floor(dd.getMonth()/3);const mk='Q'+(q+1)+' ’'+String(dd.getFullYear()).slice(2);
      if(cq!==mk){if(cq)pushSeg(botSegs,cq,cc);cq=mk;cc=1}else cc++}
    pushSeg(botSegs,cq,cc);
  }else{
    let cy=null,cnt=0;
    for(let i=0;i<days;i++){const dd=new Date(d0);dd.setDate(dd.getDate()+i);
      if(cy!==dd.getFullYear()){if(cy!==null)pushSeg(topSegs,cy,cnt);cy=dd.getFullYear();cnt=1}else cnt++}
    pushSeg(topSegs,cy,cnt);
    let cq=null,cc=0;
    for(let i=0;i<days;i++){const dd=new Date(d0);dd.setDate(dd.getDate()+i);
      const mk='Q'+(Math.floor(dd.getMonth()/3)+1);
      if(cq!==mk){if(cq)pushSeg(botSegs,cq,cc);cq=mk;cc=1}else cc++}
    pushSeg(botSegs,cq,cc);
  }
  const segRow=(segs,bot)=>`<div class="tl-hseg ${bot?'bot':''}">${segs.map(s=>`<div class="${s.cls||''}" style="width:${Math.round(s.d*ppd)}px;flex:none">${esc(String(s.label))}</div>`).join('')}</div>`;
  const gdefs=tlGroupDefs(ent,groupBy).map(g=>({...g,match:tlMatch(groupBy,g)}));
  const cf=cardFields(ent);
  let rowsHtml='',rowMeta=[];
  const wsT=ws.getTime();
  gdefs.forEach((g,gi)=>{
    const items=S[ent].filter(r=>g.match(r)&&r.start&&matchSearch(ent,r)).sort((a,b)=>a.start<b.start?-1:1);
    const laneEnd=[];
    const placed=items.map(it=>{
      const s=new Date(it.start+'T00:00:00').getTime();
      let li=laneEnd.findIndex(e=>s>=e);
      if(li<0){li=laneEnd.length;laneEnd.push(0)}
      laneEnd[li]=new Date(it.end+'T00:00:00').getTime()+864e5;
      return {it,lane:li};
    });
    const maxL=MAXLANE[mode];
    const visible=placed.filter(p=>p.lane<maxL);
    const hidden=placed.filter(p=>p.lane>=maxL);
    const rowH=Math.max(1,Math.min(maxL,Math.max(1,laneEnd.length)))*(26)+8;
    const bars=visible.map(({it,lane})=>{
      const sT=new Date(it.start+'T00:00:00').getTime(),eT=new Date(it.end+'T00:00:00').getTime();
      if(eT<wsT||sT>we.getTime())return '';
      const x=Math.max(0,Math.round((sT-wsT)/864e5*ppd));
      const w=Math.max(8,Math.round(diffDays(it.start,it.end)*ppd)-2);
      const c=barColor(ent,it,colorBy);
      const st=statFor(ent,it.statusId);
      const label=(cf.list.includes('num')&&w>150?`<span class="bn">${esc(it.num)}</span>`:'')+esc(it.name);
      const title=`${it.num} · ${it.name}\n${fmtD(it.start)} → ${fmtD(it.end)} (${diffDays(it.start,it.end)} дн.)`+(st?`\nСтатус: ${st.name}`:'');
      return `<div class="bar" data-id="${it.id}" data-s="${it.start}" data-e="${it.end}" title="${esc(title)}"
        style="left:${x}px;width:${w}px;top:${6+lane*26}px;background:linear-gradient(180deg,${c},${c}d9);color:${txtOn(c)}">
        <span class="hnd l" data-h="l"></span><span style="overflow:hidden;text-overflow:ellipsis">${label}</span><span class="hnd r" data-h="r"></span></div>`;
    }).join('');
    rowsHtml+=`<div class="tl-row" data-gi="${gi}">
      <div class="tl-left" style="height:${rowH}px"><span class="dot" style="background:${colorOf(g)}"></span>
        <span><span class="nm">${esc(g.name)}</span><br><span class="ct">${items.length} зап.</span></span>
        ${hidden.length?`<span class="more" data-gi="${gi}" title="Не поместились в видимую область">+${hidden.length}</span>`:''}</div>
      <div class="tl-canvas" data-gi="${gi}" style="width:${totalW}px;height:${rowH}px">${bars||'<span class="emptyrow">нет записей в периоде</span>'}</div></div>`;
    rowMeta.push({g,hidden:hidden.map(h=>h.it),top:0,h:rowH});
  });
  const todayX=Math.round(diffDays(toISO(ws),today)*ppd);
  mount.innerHTML=`
   <div class="tl-tools">
     <div class="seg" id="tlMode">${MODES.map(m=>`<button data-m="${m[0]}" class="${m[0]===mode?'on':''}">${m[1]}</button>`).join('')}</div>
     <div class="seg" id="tlGroup">
       ${ent!=='projects'?`<button data-g="dev" class="${groupBy==='dev'?'on':''}">По разработчикам</button><button data-g="agent" class="${groupBy==='agent'?'on':''}">По агентам</button>`:''}
       <button data-g="status" class="${groupBy==='status'?'on':''}">По статусу</button>
       <button data-g="priority" class="${groupBy==='priority'?'on':''}">По приоритету</button>
       ${ent==='projects'?`<button data-g="stage" class="${groupBy==='stage'?'on':''}">По этапу</button>`:''}
     </div>
     <select id="tlColor" style="width:auto;padding:7px 10px">
       <option value="status" ${colorBy==='status'?'selected':''}>Цвет: Статус</option>
       <option value="priority" ${colorBy==='priority'?'selected':''}>Цвет: Приоритет</option>
       ${ent!=='projects'?`<option value="dev" ${colorBy==='dev'?'selected':''}>Цвет: Разработчик</option><option value="agent" ${colorBy==='agent'?'selected':''}>Цвет: Агент</option>`:''}
       ${ent==='projects'?`<option value="stage" ${colorBy==='stage'?'selected':''}>Цвет: Этап</option>`:''}
     </select>
     <button class="btn sm" data-nav="-1">◀</button>
     <button class="btn sm" data-today>Сегодня</button>
     <button class="btn sm" data-nav="1">▶</button>
     <button class="btn sm" data-cards>⚙ Карточки</button>
     <span class="hint">Перетаскивайте полосы по дате и между строками · за края — растянуть · клик — карточка</span>
   </div>
   <div class="tl-scroll">
     <div style="min-width:${LEFTW+totalW}px;position:relative">
       <div class="tl-headrow">
         <div class="tl-corner" style="width:${LEFTW}px;min-width:${LEFTW}px;flex:none">Разработчик / Агент</div>
         <div class="tl-hc" style="width:${totalW}px;flex:none">${segRow(topSegs)}${segRow(botSegs,true)}</div>
       </div>
       <div id="tlBody" style="position:relative">${rowsHtml}
         ${todayX>=0&&todayX<=totalW?`<div class="tl-today" style="left:${LEFTW+todayX}px"></div>`:''}
       </div>
     </div>
   </div>`;
  mount.querySelectorAll('#tlMode button').forEach(b=>b.onclick=async()=>{S.prefs.tlMode[ent]=b.dataset.m;await savePrefs();render()});
  mount.querySelectorAll('#tlGroup button').forEach(b=>b.onclick=async()=>{S.prefs.tlGroup[ent]=b.dataset.g;await savePrefs();render()});
  mount.querySelector('#tlColor').onchange=async e=>{S.prefs.tlColor[ent]=e.target.value;await savePrefs();render()};
  mount.querySelector('[data-cards]').onclick=()=>openCardSettings();
  mount.querySelector('[data-today]').onclick=()=>{TL_ANCHOR[ent]=today;render()};
  mount.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    const dir=+b.dataset.nav;const step={day:31,month:92,quarter:182,year:365}[mode]*dir;
    TL_ANCHOR[ent]=addDays(TL_ANCHOR[ent],step);render();
  });
  mount.querySelectorAll('.tl-hseg.bot div').forEach(seg=>seg.onclick=()=>{
    if(mode==='year'){S.prefs.tlMode[ent]='quarter'}else if(mode==='quarter'){S.prefs.tlMode[ent]='month'}else if(mode==='month'){S.prefs.tlMode[ent]='day'}else return;
    savePrefs();render();
  });
  mount.querySelectorAll('.more').forEach(m=>m.onclick=e=>{
    e.stopPropagation();const gi=+m.dataset.gi;const rm=rowMeta[gi];
    popover(m,`<div class="pt">${esc(rm.g.name)}: еще ${rm.hidden.length} не поместилось</div>
      <div style="max-height:240px;overflow:auto;min-width:240px">
      ${rm.hidden.map(it=>{const c=barColor(ent,it,colorBy);return `<div class="pi" data-id="${it.id}"><span class="dot" style="background:${c}"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.num)} · ${esc(it.name)}</span><span class="mono" style="color:var(--mut)">${fmtD(it.start)}</span></div>`}).join('')}</div>
      <div class="pact"><button class="btn sm" data-zoom>🔍 Показать по дням</button></div>`,
      p=>{p.querySelectorAll('.pi').forEach(pi=>pi.onclick=()=>{closePop();openView(ent,+pi.dataset.id)});
        p.querySelector('[data-zoom]').onclick=async()=>{S.prefs.tlMode[ent]='day';TL_ANCHOR[ent]=rm.hidden[0]?.start||today;await savePrefs();closePop();render()}});
  });
  const body=mount.querySelector('#tlBody');
  let drag=null;
  body.addEventListener('pointerdown',e=>{
    const bar=e.target.closest('.bar');if(!bar)return;
    e.preventDefault();
    drag={bar,id:+bar.dataset.id,s:bar.dataset.s,en:bar.dataset.e,x0:e.clientX,y0:e.clientY,h:e.target.dataset.h||null,moved:false,dx:0,gi:+bar.closest('.tl-canvas').dataset.gi};
    bar.setPointerCapture(e.pointerId);
  });
  body.addEventListener('pointermove',e=>{
    if(!drag)return;
    const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
    if(!drag.moved&&Math.hypot(dx,dy)<4)return;
    drag.moved=true;drag.bar.classList.add('dragging');
    drag.dx=dx;drag.bar.style.transform=`translate(${dx}px,0)`;
    const dd=Math.round(dx/ppd);
    let ns=drag.s,ne=drag.en;
    if(drag.h==='l')ns=addDays(drag.s,Math.min(dd,diffDays(drag.s,drag.en)-1));
    else if(drag.h==='r')ne=addDays(drag.en,Math.max(dd,1-diffDays(drag.s,drag.en)));
    else{ns=addDays(drag.s,dd);ne=addDays(drag.en,dd)}
    drag.ns=ns;drag.ne=ne;
    const rows=[...body.querySelectorAll('.tl-row')];
    let tgt=drag.gi;
    rows.forEach((r,i)=>{const rc=r.getBoundingClientRect();if(e.clientY>=rc.top&&e.clientY<rc.bottom)tgt=i});
    drag.tgt=tgt;
    rows.forEach((r,i)=>r.querySelector('.tl-canvas').style.outline=i===tgt&&i!==drag.gi?'2px dashed var(--acc)':'');
    const tip=$('#tlTip');tip.classList.remove('hidden');
    tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+18)+'px';
    const gtxt=(tgt!==drag.gi&&['dev','agent','priority','stage','status'].includes(groupBy))?` → ${esc(rowMeta[tgt].g.name)}`:'';
    tip.textContent=`${fmtD(ns)} → ${fmtD(ne)} (${diffDays(ns,ne)} дн.)${gtxt}`;
  });
  const endDrag=async e=>{
    if(!drag)return;
    const d=drag;drag=null;
    $('#tlTip').classList.add('hidden');
    body.querySelectorAll('.tl-canvas').forEach(c=>c.style.outline='');
    if(!d.moved){openView(ent,d.id);return}
    d.bar.classList.remove('dragging');
    const r=S[ent].find(x=>x.id===d.id);if(!r)return;
    r.start=d.ns||r.start;r.end=d.ne||r.end;r.updatedAt=nowIso();
    if(d.tgt!==undefined&&d.tgt!==d.gi){
      const g=rowMeta[d.tgt].g;
      if(groupBy==='dev')r.devId=g.id;else if(groupBy==='agent')r.agentId=g.id;
      else if(groupBy==='priority')r.priorityId=g.id;else if(groupBy==='stage')r.stageId=g.id;
      else r.statusId=g.id;
    }
    try{await db[ent].put(r);await refreshAll();await afterChange();toast(`«${r.name}»: ${fmtD(r.start)} → ${fmtD(r.end)}`,'ok')}
    catch(err){setDbBeacon('error','🔴 Ошибка базы данных');toast('Ошибка записи','err')}
    render();
  };
  body.addEventListener('pointerup',endDrag);
  body.addEventListener('pointercancel',endDrag);
}

  const view=S.prefs.views[ent]||'table';
  const pg=$('#page');
  pg.innerHTML=`<div class="phead">
    <div><div class="kick">модуль · ${ENT[ent].ru.toLowerCase()}</div><h1>${ENT[ent].ru}</h1></div>
    <div class="big-n">${S[ent].length}</div>
    <div class="sp"></div>
    <div class="seg" id="viewSeg">
      <button data-v="table" class="${view==='table'?'on':''}">▤ Таблица <span class="n">${S[ent].length}</span></button>
      <button data-v="kanban" class="${view==='kanban'?'on':''}">▦ Канбан</button>
      <button data-v="timeline" class="${view==='timeline'?'on':''}">◫ Временная шкала</button>
    </div>
    <button class="btn pri" id="btnAdd">+ Создать</button>
  </div><div id="viewMount"></div>`;
  $('#btnAdd').onclick=()=>openForm(ent,null);
  pg.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=async()=>{S.prefs.views[ent]=b.dataset.v;await savePrefs();render()});
  const mount=$('#viewMount');
  if(view==='table')renderTableView(ent,mount);
  else if(view==='kanban')renderKanbanView(ent,mount);
  else renderTimelineView(ent,mount);
  pg.querySelectorAll('[data-addsub]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const pid=+b.dataset.addsub;

function selOptions(list,val,ph){return `<option value="">${ph||'— не выбрано —'}</option>`+list.map(o=>`<option value="${o.id}" ${o.id===val?'selected':''}>${esc(o.name)}</option>`).join('')}
function multiChecks(role,sel){return `<div class="mcheck">${S.employees.filter(e=>e.role===role).map(e=>`<label><input type="checkbox" name="m_${e.id}" ${sel.includes(e.id)?'checked':''}><span class="dot" style="background:${colorOf(e)}"></span>${esc(e.name)}</label>`).join('')||'<span style="color:var(--mut2);font-size:12px">справочник пуст</span>'}</div>`}
function openForm(ent,id,preset={}){
  const r=id?S[ent].find(x=>x.id===id):{stageProgress:{},agents:[],devs:[],...preset};
  const isNew=!id;
  let fields='';
  const F=(html,full)=>`<div class="${full?'full':''}">${html}</div>`;
  fields+=F(`<label class="fl">Название *</label><input name="name" type="text" required value="${esc(r.name||'')}" placeholder="Название…">`);
  fields+=F(`<label class="fl">Номер (авто)</label><input type="text" disabled value="${esc(r.num||(isNew?'будет присвоен':ENT[ent].letter))}" class="mono">`);
  if(ent==='tasks')fields+=F(`<label class="fl">Проект</label><select name="projectId">${selOptions(S.projects,r.projectId)}</select>`);
  if(ent==='changes')fields+=F(`<label class="fl">Задача</label><select name="taskId">${selOptions(S.tasks,r.taskId)}</select>`);
  fields+=F(`<label class="fl">Статус</label><select name="statusId">${selOptions(ent==='projects'?S.projectStatuses:S.taskStatuses,r.statusId)}</select>`);
  fields+=F(`<label class="fl">Приоритет</label><select name="priorityId">${selOptions(S.priorities,r.priorityId)}</select>`);
  if(ent==='projects')fields+=F(`<label class="fl">Текущий этап</label><select name="stageId">${selOptions(S.stages,r.stageId)}</select>`);
  if(ent!=='projects'){
    fields+=F(`<label class="fl">Главный разработчик</label><select name="devId">${selOptions(S.employees.filter(e=>e.role==='dev'),r.devId)}</select>`);
    fields+=F(`<label class="fl">Главный агент</label><select name="agentId">${selOptions(S.employees.filter(e=>e.role==='agent'),r.agentId)}</select>`);
    fields+=F(`<label class="fl">№ в системе</label><input name="extNum" type="text" value="${esc(r.extNum||'')}" placeholder="JIRA-123…">`);
    fields+=F(`<label class="fl">Ссылка из системы</label><input name="extLink" type="url" value="${esc(r.extLink||'')}" placeholder="https://…">`);
  }
  fields+=F(`<label class="fl">Дата начала</label><input name="start" type="date" value="${r.start||''}">`);
  fields+=F(`<label class="fl">Дата окончания</label><input name="end" type="date" value="${r.end||''}">`);
  fields+=F(`<label class="fl">Описание</label><textarea name="desc">${esc(r.desc||'')}</textarea>`,true);
  fields+=F(`<label class="fl">Примечание</label><textarea name="note">${esc(r.note||'')}</textarea>`,true);
  fields+=F(`<label class="fl">Агенты — участники</label>${multiChecks('agent',r.agents||[])}`,true);
  fields+=F(`<label class="fl">Разработчики — участники</label>${multiChecks('dev',r.devs||[])}`,true);
  if(ent==='projects'&&!isNew){
    /* ИСПРАВЛЕНО: убран inline oninput, повесим обработчик после открытия */
    fields+=F(`<label class="fl">Прогресс по этапам, %</label><div class="stageed">${S.stages.map(sg=>{
      const v=(r.stageProgress||{})[sg.id]||0;
      return `<div class="sr"><span><span class="dot" style="background:${colorOf(sg)}"></span> ${esc(sg.name)}</span>
        <input type="range" min="0" max="100" value="${v}" data-st="${sg.id}">
        <span class="pv mono" data-pv="${sg.id}">${v}%</span></div>`}).join('')}</div>`,true);
  }
  setDbBeacon('dirty','🟡 Есть несохраненные изменения');
  modal({title:(isNew?'Создание: ':'Редактирование: ')+ENT[ent].one,sub:ent.toUpperCase()+(r.num?' · '+r.num:''),wide:true,
    body:`<form id="eform"><div class="fgrid">${fields}</div></form>`,
    foot:`<button class="btn" data-c>Отмена</button><button class="btn pri" data-s>💾 Сохранить</button>`,
    /* ИСПРАВЛЕНО: box.el.querySelector везде */
    mount(box){
      /* обработчики для слайдеров прогресса */
      box.el.querySelectorAll('input[data-st]').forEach(inp=>{
        const pvEl=box.el.querySelector(`.pv[data-pv="${inp.dataset.st}"]`);
        inp.addEventListener('input',()=>{if(pvEl)pvEl.textContent=inp.value+'%'});
      });
      box.el.querySelector('[data-c]').onclick=()=>{box.close();setDbBeacon('saved','🟢 База данных сохранена')};
      box.el.querySelector('[data-s]').onclick=async()=>{
        const f=box.el.querySelector('#eform');
        if(!f.name.value.trim()){toast('Укажите название','err');return}
        const obj={...r,name:f.name.value.trim(),desc:f.desc.value,note:f.note.value,
          statusId:f.statusId.value?+f.statusId.value:null,priorityId:f.priorityId.value?+f.priorityId.value:null,
          start:f.start.value||null,end:f.end.value||null};
        if(obj.start&&obj.end&&obj.end<obj.start){toast('Дата окончания раньше начала','err');return}
        if(ent==='projects')obj.stageId=f.stageId.value?+f.stageId.value:null;
        if(ent==='tasks'){obj.projectId=f.projectId.value?+f.projectId.value:null;obj.extNum=f.extNum.value;obj.extLink=f.extLink.value;obj.devId=f.devId.value?+f.devId.value:null;obj.agentId=f.agentId.value?+f.agentId.value:null}
        if(ent==='changes'){obj.taskId=f.taskId.value?+f.taskId.value:null;obj.extNum=f.extNum.value;obj.extLink=f.extLink.value;obj.devId=f.devId.value?+f.devId.value:null;obj.agentId=f.agentId.value?+f.agentId.value:null}
        obj.agents=[...f.querySelectorAll('input[name^="m_"]:checked')].map(i=>+i.name.slice(2)).filter(i=>emp(i)?.role==='agent');
        obj.devs=[...f.querySelectorAll('input[name^="m_"]:checked')].map(i=>+i.name.slice(2)).filter(i=>emp(i)?.role==='dev');
        if(ent==='projects'&&!isNew){
          const old=r.stageProgress||{};const np={};
          box.el.querySelectorAll('input[data-st]').forEach(i=>np[+i.dataset.st]=+i.value);
          obj.stageProgress=np;
          S.stages.forEach(sg=>{const a=old[sg.id]||0,b=np[sg.id]||0;
            if(a!==b)S.history.push({projectId:obj.id,ts:nowIso(),stageId:sg.id,from:a,to:b})});
        }
        try{
          if(isNew){
            S.counters[ENT[ent].ctr]++;obj.num=ENT[ent].letter+'-'+String(S.counters[ENT[ent].ctr]).padStart(3,'0');
            obj.createdAt=nowIso();obj.id=await db[ent].add(obj);
          }else{obj.updatedAt=nowIso();await db[ent].put(obj)}
          if(S.history.length){await db.stageHistory.bulkAdd(S.history.splice(0))}
          await refreshAll();await afterChange();await savePrefs();
          box.close();setDbBeacon('saved','🟢 База данных сохранена');
          toast((isNew?'Создано: ':'Сохранено: ')+obj.num+' «'+obj.name+'»','ok');render();
        }catch(err){setDbBeacon('error','🔴 Ошибка базы данных');toast('Ошибка записи: '+err.message,'err')}
      };
    }});
}

function openView(ent,id,tab='main'){
  const r=S[ent].find(x=>x.id===id);if(!r)return;
  const st=statFor(ent,r.statusId),pr=pri(r.priorityId),sg=stg(r.stageId);
  const kids=ent==='projects'?S.tasks.filter(t=>t.projectId===id):ent==='tasks'?S.changes.filter(c=>c.taskId===id):[];
  const hist=ent==='projects'?S.history.filter(h=>h.projectId===id).sort((a,b)=>b.ts<a.ts?-1:1).sort((a,b)=>b.ts.localeCompare(a.ts)):[];
  const dl=(k,v)=>`<dt>${k}</dt><dd>${v||'<span style="color:var(--mut2)">—</span>'}</dd>`;
  let main=`<div class="dl">
    ${dl('Номер',`<span class="mono" style="font-weight:700">${esc(r.num)}</span>`)}

      box.el.querySelector('[data-qdup]').onclick=async()=>{
        const cp={...r,id:undefined,createdAt:nowIso(),updatedAt:nowIso(),name:r.name+' (копия)'};

      box.el.querySelectorAll('[data-goto]').forEach(l=>l.onclick=()=>{

    }});

async function delRecord(ent,id){
  const r=S[ent].find(x=>x.id===id);if(!r)return;
  confirmBox(`Удалить ${ENT[ent].one} «${r.name}» (${r.num})? Действие необратимо.`,async()=>{
    try{
      await db[ent].delete(id);
      if(ent==='projects'){await db.tasks.where('projectId').equals(id).delete();await db.stageHistory.where('projectId').equals(id).delete()}
      if(ent==='tasks'){await db.changes.where('taskId').equals(id).delete()}
      await refreshAll();await afterChange();toast('Запись удалена','ok');render();
    }catch(e){setDbBeacon('error','🔴 Ошибка базы данных');toast('Ошибка удаления','err')}
  });
}

function buildSnapshot(){return {version:1,app:'ProjectsSPA',exportDate:nowIso(),data:{
  projects:S.projects,tasks:S.tasks,changes:S.changes,employees:S.employees,priorities:S.priorities,
  taskStatuses:S.taskStatuses,projectStatuses:S.projectStatuses,stages:S.stages,stageHistory:S.history,
  prefs:S.prefs,counters:S.counters}}}
async function doExport(){
  try{
    download('app_backup_'+stamp()+'.json',JSON.stringify(buildSnapshot(),null,2));
    S.lastExport=nowIso();await db.meta.put({key:'lastExport',value:S.lastExport});
    updateBackupBeacon();$('#sbExport').textContent=fmtDT(S.lastExport);
    toast('Экспорт выполнен: app_backup_'+stamp()+'.json','ok');
  }catch(e){toast('Ошибка экспорта','err')}
}
async function doImport(file){
  try{
    const txt=await file.text();
    if(!txt.trim())return toast('Неверный формат файла: файл пустой','err');
    let obj;try{obj=JSON.parse(txt)}catch(e){return toast('Файл поврежден: невалидный JSON','err')}
    let data=null;
    if(obj&&obj.data&&typeof obj.data==='object'&&Array.isArray(obj.data.projects))data=obj.data;
    else if(obj&&Array.isArray(obj.records))data={projects:obj.records.filter(r=>r&&r.name).map((r,i)=>({num:'P-'+String(i+1).padStart(3,'0'),name:r.name,desc:r.description||'',stageProgress:{},agents:[],devs:[],createdAt:r.createdAt||nowIso()})),tasks:[],changes:[]};
    if(!data)return toast('Структура данных не поддерживается','err');
    const cleared={};
    for(const t of ['projects','tasks','changes','employees','priorities','taskStatuses','projectStatuses','stages','stageHistory']){await db[t].clear();cleared[t]=1}
    for(const k of ['projects','tasks','changes','employees','priorities','taskStatuses','projectStatuses','stages','stageHistory']){
      const arr=Array.isArray(data[k])?data[k].filter(x=>x&&typeof x==='object'):[];
      if(arr.length)await db[k].bulkAdd(arr);
    }
    if(data.prefs&&typeof data.prefs==='object')S.prefs=Object.assign(S.prefs,data.prefs);
    if(data.counters)S.counters=data.counters;else{
      S.counters={p:S.projects.length,t:S.tasks.length,c:S.changes.length};
    }
    await savePrefs();await refreshAll();await afterChange();
    toast('Импорт выполнен успешно','ok');render();
  }catch(e){setDbBeacon('error','🔴 Ошибка базы данных');toast('Ошибка импорта: '+e.message,'err')}
}
async function autoSaveNow(){
  if(!S.fileHandle)return;
  try{const w=await S.fileHandle.createWritable();await w.write(JSON.stringify(buildSnapshot(),null,2));await w.close()}
  catch(e){toast('Ошибка авто-сохранения в файл','err')}
}
const scheduleAutoFile=debounce(autoSaveNow,900);

async function refreshAll(){
  [S.projects,S.tasks,S.changes,S.employees,S.priorities,S.taskStatuses,S.projectStatuses,S.stages,S.history]=
    await Promise.all([db.projects.toArray(),db.tasks.toArray(),db.changes.toArray(),db.employees.toArray(),
      db.priorities.toArray(),db.taskStatuses.toArray(),db.projectStatuses.toArray(),db.stages.toArray(),db.stageHistory.toArray()]);
  updateCounts();
}

async function refreshAll2(){await refreshAll();return true}

function render(){
  closePop();
  $$('#nav .nv').forEach(n=>n.classList.toggle('on',n.dataset.p===S.page));
  if(S.page==='refs')renderRefs();
  else if(S.page==='settings')renderSettings();
  else if(['projects','tasks','changes'].includes(S.page))renderModule(S.page);
  else{S.page='projects';render()}
}
function go(p){S.page=p;if(location.hash!=='/'+p)location.hash='/'+p;render()}
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#/','');S.page=h||'projects';render()});
$('#nav').addEventListener('click',e=>{const n=e.target.closest('.nv');if(n)go(n.dataset.p)});
$('#btnExport').onclick=doExport;
$('#btnImport').onclick=()=>$('#importFile').click();
$('#importFile').onchange=e=>{if(e.target.files[0])doImport(e.target.files[0]);e.target.value=''};
$('#gsearch').addEventListener('input',debounce(e=>{S.search=e.target.value.trim();render()},180));

(async function init(){
  setDbBeacon('init','⚪ Инициализация');
  try{
    await db.open();
    const meta=async k=>(await db.meta.get(k))?.value;
    const prefs=await meta('prefs');if(prefs)S.prefs={...S.prefs,...prefs};
    const cnt=await meta('counters');if(cnt)S.counters=cnt;
    S.lastExport=await meta('lastExport')||null;S.lastSaved=await meta('lastSaved')||null;
    const empty=!(await db.projectStatuses.count());
    if(empty){await seedDemo(true)}
    await refreshAll();
    $('#sbSaved').textContent=S.lastSaved?fmtDT(S.lastSaved):'—';
    setDbBeacon('saved','🟢 База данных сохранена');
    updateBackupBeacon();
    const h=location.hash.replace('#/','');S.page=h||'projects';
    render();
  }catch(e){
    console.error(e);
    setDbBeacon('error','🔴 Ошибка базы данных');
    toast('Ошибка инициализации БД: '+e.message,'err');
  }
})();

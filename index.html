<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects · Планирование загрузки разработчиков</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='18' width='60' height='16' rx='4' fill='%230B7285'/><rect x='30' y='42' width='62' height='16' rx='4' fill='%23E8A13C'/><rect x='16' y='66' width='44' height='16' rx='4' fill='%23D1495B'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/components/buttons.css">
  <link rel="stylesheet" href="./styles/components/modal.css">
  <link rel="stylesheet" href="./styles/components/table.css">
  <link rel="stylesheet" href="./styles/components/kanban.css">
  <link rel="stylesheet" href="./styles/components/timeline.css">
  <link rel="stylesheet" href="./styles/modules/projects.css">
  <link rel="stylesheet" href="./styles/modules/refs.css">
  <link rel="stylesheet" href="./styles/modules/settings.css">
  <link rel="stylesheet" href="./styles/modules/reports.css">
  <link rel="stylesheet" href="./styles/modules/dbInspector.css">

</head>
<body>

<div id="app">
  <div id="sideOverlay" class="side-overlay"></div>
  <aside id="side">
    <div class="logo">
      <div class="logo-head">
        <div class="mk"><i>P</i><span class="logo-txt">Projects</span></div>
        <button id="btnToggleSide" class="side-collapse-btn" title="Свернуть / Развернуть меню" aria-label="Свернуть меню">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <div class="sub">Планирование разработки</div>
    </div>
    <nav>
      <div class="nv on" data-page="projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg>
        <span class="t">Проекты</span>
        <span class="cnt" id="cnt-p">0</span>
      </div>
      <div class="nv" data-page="tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span class="t">Задачи</span>
        <span class="cnt" id="cnt-t">0</span>
      </div>
      <div class="nv" data-page="changes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        <span class="t">Изменения</span>
        <span class="cnt" id="cnt-c">0</span>
      </div>
      <div class="nv" data-page="reports" style="margin-top:14px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        <span class="t">Отчёты / BI</span>
      </div>
      <div class="nv" data-page="stageHistory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
        <span class="t">Журнал этапов</span>
        <span class="cnt" id="cnt-sh">0</span>
      </div>
      <div class="nv" data-page="refs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span class="t">Справочники</span>
      </div>
      <div class="nv" data-page="logs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span class="t">Журнал действий</span>
        <span class="cnt" id="cnt-l">0</span>
      </div>
      <div class="nv" data-page="dbInspector">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
        <span class="t">Инспектор БД</span>
      </div>
      <div class="nv" data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="t">Настройки</span>
      </div>
    </nav>
    <div class="side-foot">
      Серверная БД: <b>SQLite</b><br>
      REST API · ES Modules
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div class="mobile-logo"><i>P</i>Projects</div>
      <button id="btnMobileMenu" class="mobile-menu-btn" title="Меню" aria-label="Меню">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="topSearch" placeholder="Поиск по всем полям…" autocomplete="off">
      </div>
      <div style="flex:1"></div>
      <div class="beacon ok" id="dbBeacon"><span class="dot"></span><span class="txt">SQLite подключена</span></div>
    </header>

    <div id="page"></div>

    <footer id="statusbar">
      <span>Записей: <b id="sbCount">0</b> <span id="sbSplit"></span></span>
      <span class="sp"></span>
      <span>Сохранено: <b id="sbSaved">—</b></span>
      <span>Экспорт: <b id="sbExport">—</b></span>
    </footer>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>
<div id="tlTip" class="tip hidden"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
